    <text x="72" y="318">1.0</text>
    <text x="72" y="252">2.0</text>
    <text x="72" y="186">3.0</text>
    <text x="72" y="120">4.0</text>
    <text x="72" y="54">5.0</text>
  </g>
  <text x="24" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle" transform="rotate(-90, 24, 215)">
    Execution Time (ms)
  </text>

  <!-- X-Axis Labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569" text-anchor="middle">
