  <line x1="120" y1="85" x2="150" y2="85" stroke="#dc2626" stroke-width="2.5"/>
  <text x="160" y="89" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b">Divide &amp; Conquer — Θ(n)</text>
  <line x1="120" y1="110" x2="150" y2="110" stroke="#2563eb" stroke-width="2.5"/>
