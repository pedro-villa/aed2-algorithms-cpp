<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" width="100%" height="100%">
  <rect width="820" height="450" fill="#ffffff" rx="8"/>
  
  <!-- Title -->
  <text x="410" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">
    Empirical Execution Time: Direct Sliding Window vs. Divide &amp; Conquer
  </text>

  <!-- Grid lines (Horizontal: 0 to 5 ms) -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="80" y1="380" x2="760" y2="380"/>
    <line x1="80" y1="314" x2="760" y2="314"/>
    <line x1="80" y1="248" x2="760" y2="248"/>
    <line x1="80" y1="182" x2="760" y2="182"/>
    <line x1="80" y1="116" x2="760" y2="116"/>
    <line x1="80" y1="50"  x2="760" y2="50"/>
  </g>

  <!-- Grid lines (Vertical: 0 to 2,000,000) -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4">
    <line x1="216" y1="50" x2="216" y2="380"/>
    <line x1="352" y1="50" x2="352" y2="380"/>
    <line x1="488" y1="50" x2="488" y2="380"/>
    <line x1="624" y1="50" x2="624" y2="380"/>
    <line x1="760" y1="50" x2="760" y2="380"/>
  </g>

  <!-- Axes -->
  <g stroke="#475569" stroke-width="1.5">
    <line x1="80" y1="380" x2="765" y2="380"/>
    <line x1="80" y1="45"  x2="80"  y2="380"/>
  </g>

  <!-- Y-Axis Labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569" text-anchor="end">
